name: Build and Deploy

on:
  push:
    branches: [ "master" , "staging" ]

jobs:

  build-website:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to TGM Docker Registry
      uses: docker/login-action@v3
      with:
        registry: registry.tgm.one
        username: robot$tgm.one+github
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Website Tag Names
      run: |
        echo "${{ steps.extract_branch.outputs.branch }}"
        if [ ${{ steps.extract_branch.outputs.branch }} = "master" ]; then
          echo "TAG_LATEST_WEBSITE=tgm-one:latest" >> $GITHUB_ENV
          echo "TAG_COMMIT_WEBSITE=tgm-one:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        elif [ ${{ steps.extract_branch.outputs.branch }} = "staging" ]; then
          echo "TAG_LATEST_WEBSITE=tgm-one-stage:latest" >> $GITHUB_ENV
          echo "TAG_COMMIT_WEBSITE=tgm-one-stage:$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        else
          exit 0
        fi

    - name: Build and push Website
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        file: .docker/Dockerfile
        push: true
        build-args: |
          FOLIGO_ANALYTICS_KEY=${{ secrets.FOLIGO_ANALYTICS_KEY }}
        tags: |
          registry.tgm.one/tgm.one/${{ env.TAG_LATEST_WEBSITE }}
          registry.tgm.one/tgm.one/${{ env.TAG_COMMIT_WEBSITE }}
        cache-from: type=registry,ref=registry.tgm.one/tgm.one/${{ env.TAG_LATEST_WEBSITE }}
        cache-to: type=inline

  deploy-rancher:
    needs: [build-website]
    runs-on: ubuntu-latest
    steps:
    - name: Extract branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Redeploy Rancher
      env:
        RANCHER_TOKEN: ${{ secrets.RANCHER_TOKEN }}
        BRANCH: ${{ steps.extract_branch.outputs.branch }}
      run: |
        set -euo pipefail
        url='https://rancher.tgm.one'

        redeploy() {
            local cluster=$1 namespace=$2 app=$3 now patch
            now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            patch=$(jq -cn --arg ts "$now" \
              '{spec:{template:{metadata:{annotations:{"cattle.io/timestamp":$ts}}}}}')

            curl --fail-with-body -sS -k -u "$RANCHER_TOKEN" \
              -X PATCH \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/strategic-merge-patch+json' \
              --data-binary "$patch" \
              -o /dev/null \
              "$url/k8s/clusters/$cluster/apis/apps/v1/namespaces/$namespace/deployments/$app"
            echo "Redeploy triggered: $cluster/$namespace/$app at $now"
        }

        echo "$BRANCH"
        if [ "$BRANCH" = "master" ]; then
            redeploy c-lx99g tgm-one website
        elif [ "$BRANCH" = "staging" ]; then
            redeploy local tgm-one-staging tgm-one-staging
        else
            exit 0
        fi
